<style>
/* ---------- پایه و رنگ‌ها ---------- */
:root{--bg:#0a0a0f;--panel:#14141f;--line:#26263a;--tx:#e8e8f2;--mute:#8d8da6;--a1:#a855f7;--a2:#3b82f6}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Vazirmatn',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;
  background-image:radial-gradient(600px 300px at 90% -5%,color-mix(in srgb,var(--a1) 13%,transparent),transparent),radial-gradient(600px 300px at 5% 0,color-mix(in srgb,var(--a2) 12%,transparent),transparent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}

/* ---------- هدر ---------- */
header{position:sticky;top:0;z-index:10;background:#0a0a0fe6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.35rem;direction:ltr;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 24px color-mix(in srgb,var(--a1) 33%,transparent)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:7px 14px;border-radius:999px;color:var(--mute);text-decoration:none;font-size:.92rem;border:1px solid transparent}
nav a:hover{color:var(--tx)}
nav a.on{color:#fff;border-color:var(--a1);box-shadow:0 0 14px color-mix(in srgb,var(--a1) 33%,transparent) inset,0 0 10px color-mix(in srgb,var(--a1) 27%,transparent)}

/* ---------- محتوا ---------- */
main{flex:1;width:100%;max-width:1200px;margin:auto;padding:18px 14px}
h1{font-size:1.4rem;margin-bottom:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tools input,.tools select,.f input,.f select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tools input{flex:1 1 220px}
.tools input:focus,.f input:focus{border-color:var(--a1);outline:none}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.on,.btn.pri{border-color:var(--a1);background:linear-gradient(90deg,color-mix(in srgb,var(--a1) 20%,transparent),color-mix(in srgb,var(--a2) 20%,transparent))}
.cnt{color:var(--mute);font-size:.85rem;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 18px #0006;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);border-color:var(--a1);box-shadow:0 8px 26px color-mix(in srgb,var(--a1) 20%,transparent)}
.cv{position:relative;aspect-ratio:3/4;background:#000}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.pl{position:absolute;top:8px;right:8px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:#0a0a0fcc;border:1px solid var(--a2);direction:ltr}
.fav{position:absolute;top:6px;left:6px;width:34px;height:34px;border-radius:50%;border:0;background:#0a0a0fcc;cursor:pointer;font-size:1.05rem}
.in{padding:10px 12px}
.in h3{font-size:.95rem;line-height:1.4;direction:ltr;text-align:left}
.in p{color:var(--mute);font-size:.8rem;margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:50px 10px}

/* ---------- پنل مدیریت ---------- */
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:20px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--mute)}
.f .btn{align-self:end}
.msg{grid-column:1/-1;font-size:.88rem;min-height:1.2em}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.9rem}
.row b{flex:1;direction:ltr;text-align:left;font-weight:600}
.row span{color:var(--mute);font-size:.8rem}
.del{background:none;border:1px solid #f43f5e88;color:#fb7185;border-radius:8px;padding:4px 10px;cursor:pointer}
.del:hover{background:#f43f5e22}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:520px;overflow:auto}

/* ---------- فوتر ---------- */
footer{border-top:1px solid var(--line);background:#07070b;padding:20px 14px;text-align:center;color:var(--mute);font-size:.88rem;line-height:2}
footer strong{color:var(--tx);direction:ltr;display:inline-block}
footer a{color:var(--a2);text-decoration:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- تم‌ها ---------- */
body[data-t=ps]{--bg:#050b1a;--panel:#0c1630;--line:#1b2c55;--a1:#3b82f6;--a2:#22d3ee}
body[data-t=xbox]{--bg:#040f08;--panel:#0b1a10;--line:#173a22;--a1:#22c55e;--a2:#a3e635}
main,footer{position:relative;z-index:1}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
h2{font-size:1.1rem;margin:22px 0 12px}
/* منوی کشویی */
.dd{position:relative}
.ddb,.ib{background:none;border:1px solid transparent;border-radius:999px;padding:7px 14px;color:var(--mute);font-size:.92rem;cursor:pointer}
.ddb:hover,.dd.on .ddb{color:var(--tx)}
.dd.on .ddb{border-color:var(--a1)}
.ib{border-color:var(--line);color:var(--tx)}
.dm{display:none;position:absolute;top:calc(100% + 6px);inset-inline-start:0;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px #000a;z-index:20}
.dd.open .dm{display:block}
.dm a{display:block;border-radius:8px}
.dm a:hover{background:color-mix(in srgb,var(--a1) 18%,transparent)}
.logo{cursor:pointer;user-select:none}
/* آیکون پلتفرم */
.pls{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap}
.p{font-style:normal;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:999px;background:#0a0a0fd9;border:1px solid;direction:ltr}
.p.PS5{color:#93c5fd;border-color:#3b82f6}.p.PS4{color:#a5b4fc;border-color:#6366f1}.p.Xbox{color:#86efac;border-color:#22c55e}
/* هیرو و تاس */
.hero{display:grid;gap:18px;grid-template-columns:1.2fr 1fr;align-items:center;padding:28px;margin-bottom:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 18%,var(--panel)),var(--panel) 60%,color-mix(in srgb,var(--a2) 14%,var(--panel)));box-shadow:0 0 44px color-mix(in srgb,var(--a1) 16%,transparent)}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding:18px}}
.hero h1{font-size:clamp(1.7rem,5vw,2.7rem);font-weight:800;line-height:1.4;margin:0 0 8px;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);line-height:1.9}
.dice{text-align:center}
#dc{width:130px;height:130px;border-radius:32px;border:2px solid var(--a1);background:radial-gradient(circle,color-mix(in srgb,var(--a1) 30%,transparent),transparent 70%),var(--panel);cursor:pointer;box-shadow:0 0 30px color-mix(in srgb,var(--a1) 45%,transparent);transition:transform .15s}
#dc:hover{transform:scale(1.06)}
#di{display:inline-block;font-size:4.2rem;line-height:1}
#di.roll{animation:rl .9s ease-in-out}
@keyframes rl{to{transform:rotate(900deg) scale(1.15)}}
#dr{margin-top:14px;min-height:3.4em;line-height:2}
#dr b{color:var(--a2)}
/* تروفی */
.tb{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px}
.lv{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.lv span{color:var(--mute);font-size:.85rem}
.bar2{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}
.tp{display:flex;flex-wrap:wrap;gap:10px}
.t{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;opacity:.4;filter:grayscale(1)}
.t.on{opacity:1;filter:none;border-color:var(--a1);box-shadow:0 0 12px color-mix(in srgb,var(--a1) 40%,transparent)}
.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:50;background:var(--panel);border:1px solid var(--a1);border-radius:999px;padding:10px 20px;box-shadow:0 0 24px color-mix(in srgb,var(--a1) 50%,transparent);animation:ti .3s}
@keyframes ti{from{opacity:0;transform:translate(-50%,-10px)}}
/* خط زمانی */
.yrs{display:flex;gap:10px;overflow-x:auto;padding:10px 2px 14px;border-bottom:2px solid var(--line)}
.yr{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 24px;font-size:1.2rem;font-weight:800;cursor:pointer}
.yr.on{border-color:var(--a1);box-shadow:0 0 18px color-mix(in srgb,var(--a1) 45%,transparent)}
.tl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.tl h2{margin-top:0}
.ch{display:inline-block;margin:4px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:.85rem}
.ch:hover{border-color:var(--a2)}
/* فروشگاه */
.pi{aspect-ratio:4/3;display:grid;place-items:center;font-size:3rem}
.call{display:block;margin-top:8px;text-align:center;padding:7px;border-radius:9px;border:1px solid var(--a1);color:var(--tx);text-decoration:none;font-size:.9rem}
.call:hover{background:color-mix(in srgb,var(--a1) 25%,transparent)}
.pr h3{font-size:.88rem}
/* نظرسنجی */
.poll{margin-top:30px;padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--a2) 10%,var(--panel)),var(--panel))}
.poll h2{margin-top:0}.poll p{color:var(--mute);margin-bottom:12px}
.poll form{display:flex;gap:8px;flex-wrap:wrap}
.poll input{flex:1 1 140px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.poll .msg{margin-top:10px}
/* مدیریت */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--mute);font-size:.85rem}
.sc b{display:block;font-size:1.7rem;color:var(--tx)}
.note{color:var(--mute);font-size:.82rem;margin-bottom:10px}
.fw{grid-column:1/-1;margin:0}
.ck{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ck label{flex-direction:row;align-items:center;color:var(--tx)}
.ck input{padding:0;width:auto}
.pv{width:90px;border-radius:8px;display:block}.pv[hidden]{display:none}
.eb{background:none;border:1px solid var(--a2);color:var(--tx);border-radius:8px;padding:4px 10px;cursor:pointer}
.tl ol{padding-inline-start:20px;line-height:2}.tl li b{margin-inline-start:6px;color:var(--a2)}
/* ---------- رفع افتادن منو زیر کارت‌ها ---------- */
header{z-index:100}
/* ---------- ردیف‌های افقی صفحه اصلی ---------- */
.rw{margin:28px 0;position:relative}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rh h2{margin:0}
.all{color:var(--a2);text-decoration:none;font-size:.9rem}
.rs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:6px 2px 12px}
.rs::-webkit-scrollbar{display:none}
.rs>*{flex:0 0 auto;width:160px;scroll-snap-align:start}
@media(min-width:700px){.rs>*{width:190px}}
.ar{position:absolute;top:50%;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--a1);background:#0a0a0fe6;color:var(--tx);cursor:pointer;font-size:1.4rem;line-height:1;box-shadow:0 0 14px color-mix(in srgb,var(--a1) 50%,transparent)}
.ar.l{left:-8px}.ar.r{right:-8px}
.ar:hover{background:color-mix(in srgb,var(--a1) 35%,#0a0a0f)}
.more{display:grid;place-content:center;text-align:center;gap:8px;border:1px dashed var(--a1);border-radius:14px;color:var(--tx);text-decoration:none;min-height:200px}
.more b{font-size:1.8rem;color:var(--a2)}
.more:hover{background:color-mix(in srgb,var(--a1) 15%,transparent)}
/* عکس محصول */
.pi{position:relative;overflow:hidden}
.pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f1f1f6;padding:8px}
.pi img[hidden]{display:none}
.pi .p{position:absolute;top:8px;right:8px;z-index:1}
.sd{background:none;border:1px solid #f43f5e88;color:#fb7185;border-radius:8px;padding:4px 10px;cursor:pointer}
.sd:hover{background:#f43f5e22}
.pe{background:none;border:1px solid var(--a2);color:var(--tx);border-radius:8px;padding:4px 10px;cursor:pointer}
.pd{background:none;border:1px solid #f43f5e88;color:#fb7185;border-radius:8px;padding:4px 10px;cursor:pointer}
.pd:hover{background:#f43f5e22}
</style>
</head>

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);findCover(e.target)}}),{rootMargin:'250px'});
const watch=()=>document.querySelectorAll('img[data-auto],img[data-wk]').forEach(i=>io.observe(i));
const show=(i,u)=>{i.src=u;i.hidden=false};
const sum=async(t,any)=>{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t.replace(/ /g,'_')));if(!r.ok)return'';const d=await r.json();return d.thumbnail&&(any||/(\d{4}.*game|video game)/i.test(d.description||''))?d.thumbnail.source:''};
async function findCover(img){
  const w=img.dataset.wk,t=w||img.alt,k=w?'wk:'+w:t;
  if(k in covers){if(covers[k])show(img,covers[k]);return}
  try{
    let u=await sum(t,!!w);
    if(!u&&!w){ // اگر عنوان دقیق پیدا نشد، جستجو می‌کنیم
      const r=await fetch('https://en.wikipedia.org/w/rest.php/v1/search/page?limit=3&q='+encodeURIComponent(t+' video game'));
      const h=((await r.json()).pages||[]).find(p=>/game/i.test(p.description||''));
      if(h)u=await sum(h.title);
    }
    covers[k]=u;save('gs_cv2',covers);if(u)show(img,u);
  }catch{}
}

  const e=ed||{title:'',genre:'',year:2026,platforms:[],cover:''};cvd=e.cover;const ep=edp||{n:'',p:'PS5',k:'c',img:'',x:''};pimg=ep.img;
  const top=Object.entries(st.f).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,n])=>{const g=games.find(x=>x.id==id);return g?`<li><span dir="ltr">${esc(g.title)}</span><b>${fa(n)}</b></li>`:''}).join('');
  main.innerHTML=`<h1>پنل مدیریت</h1>
  <div class="sg"><div class="sc"><b>${fa(st.v)}</b>بازدید ثبت‌شده</div><div class="sc"><b>${fa(games.length)}</b>بازی در فروشگاه</div><div class="sc"><b>${fa(favs.size)}</b>علاقه‌مندی</div></div>
  <div class="note">این آمار فقط مربوط به همین مرورگر است. شمارش واقعی همه بازدیدکننده‌ها و گیمرهای آنلاین به سرور نیاز دارد.</div>
  <div class="tl"><h2>محبوب‌ترین بازی‌ها</h2><ol>${top||'<li>هنوز داده‌ای نیست</li>'}</ol></div>
  <h2>${ed?'ویرایش بازی':'افزودن بازی'}</h2>
  <form class="f" id="af" autocomplete="off">
    <label>نام بازی<input name="t" required dir="ltr" value="${esc(e.title)}"></label>
    <label>ژانر<input name="g" required list="gl" value="${esc(e.genre)}"></label>
    <datalist id="gl">${Object.values(G).map(x=>`<option value="${x}">`).join('')}</datalist>
    <label>سال انتشار<input name="y" type="number" min="2000" max="2035" required value="${e.year}"></label>
    <div class="ck">${['PS5','PS4','Xbox'].map(p=>`<label><input type="checkbox" name="p" value="${p}" ${e.platforms.includes(p)?'checked':''}> ${p}</label>`).join('')}</div>
    <label>لینک عکس<input name="c" type="url" dir="ltr" placeholder="https://..." value="${e.cover&&!e.cover.startsWith('data:')?esc(e.cover):''}"></label>
    <label>یا انتخاب از گالری<input type="file" id="cf" accept="image/*"></label>
    <img id="pv" class="pv" ${e.cover?`src="${esc(e.cover)}"`:'hidden'} alt="">
    <button class="btn pri">${ed?'ذخیره تغییرات':'افزودن بازی'}</button>${ed?'<button type="button" class="btn" id="cn">انصراف</button>':''}
    <div class="msg" id="msg"></div></form>
  <h2>مدیریت بازی‌ها</h2>
  <div class="tools"><input id="as" type="search" placeholder="جستجوی بازی برای ویرایش یا حذف..."></div>
  <div class="cnt" id="ac"></div><div class="list" id="al"></div>
  <h2>${edp?'ویرایش محصول':'افزودن محصول'}</h2>
  <form class="f" id="pf2" autocomplete="off">
    <label>نام محصول<input name="n" required dir="ltr" value="${esc(ep.n)}"></label>
    <label>پلتفرم<select name="p">${['PS5','PS4','Xbox'].map(p=>`<option ${p===ep.p?'selected':''}>${p}</option>`).join('')}</select></label>
    <label>دسته<select name="k">${[['d','دستگاه'],...Object.entries(KN)].map(([k,t])=>`<option value="${k}" ${k===ep.k?'selected':''}>${t}</option>`).join('')}</select></label>
    <label>لینک عکس<input name="c" type="url" dir="ltr" placeholder="https://..." value="${ep.img&&!ep.img.startsWith('data:')?esc(ep.img):''}"></label>
    <label>یا انتخاب از گالری<input type="file" id="pcf" accept="image/*"></label>
    <img id="ppv" class="pv" ${ep.img?`src="${esc(ep.img)}"`:'hidden'} alt="">
    <button class="btn pri">${edp?'ذخیره تغییرات':'افزودن محصول'}</button>${edp?'<button type="button" class="btn" id="pcn">انصراف</button>':''}
    <div class="msg" id="pmsg"></div></form>
  <h2>مدیریت محصولات (دستگاه‌ها و لوازم جانبی)</h2>
  <div class="tools"><input id="ps" type="search" placeholder="جستجوی محصول برای ویرایش یا حذف..."></div>
  <div class="cnt" id="pc"></div><div class="list" id="pl"></div>
  <h2>پیشنهادهای نظرسنجی (این مرورگر)</h2>
  <div class="list" id="sl"></div>
  <p style="margin-top:20px"><button class="btn" id="lo">خروج از پنل</button></p>`;
  const f=$('#af');
  f.elements.c.oninput=()=>{cvd=''};
  $('#cf').onchange=ev=>{ // انتخاب عکس از گالری و کوچک‌کردن آن
    const fl=ev.target.files[0];if(!fl)return;const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=360;c.height=480;const x=c.getContext('2d'),s=Math.max(360/im.width,480/im.height);
      x.drawImage(im,(360-im.width*s)/2,(480-im.height*s)/2,im.width*s,im.height*s);cvd=c.toDataURL('image/jpeg',.8);f.elements.c.value='';$('#pv').src=cvd;$('#pv').hidden=false};im.src=r.result};
    r.readAsDataURL(fl)};
  f.onsubmit=ev=>{
    ev.preventDefault();const d=new FormData(f),p=d.getAll('p');
    if(!p.length)return msg('حداقل یک پلتفرم را انتخاب کنید.',1);
    const o={title:d.get('t').trim(),genre:d.get('g').trim(),year:+d.get('y'),platforms:['PS5','PS4','Xbox'].filter(x=>p.includes(x)),cover:cvd&&cvd.startsWith('data:')?cvd:d.get('c').trim()};
    if(ed)Object.assign(ed,o);else games.unshift({id:Math.max(0,...games.map(g=>g.id))+1,...o});
    if(!save('gs_g2',games))return msg('حافظه مرورگر پر شد؛ عکس کوچک‌تری انتخاب کنید.',1);
    toast(ed?'✅ تغییرات ذخیره شد':'✅ بازی اضافه شد');ed=null;drawAdmin();
  };
  if(ed)$('#cn').onclick=()=>{ed=null;drawAdmin()};
  $('#as').oninput=drawList;$('#lo').onclick=()=>{try{sessionStorage.removeItem('gs_ok')}catch{}location.hash='#home';route()};
  drawList();drawSg();bindPr();
}
// کوچک‌کردن عکس انتخاب‌شده از گالری (برای محصولات)
function shrink(fl,w,h,cb){
  if(!fl)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,w/im.width,h/im.height);
    c.width=im.width*s;c.height=im.height*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.src=r.result};
  r.readAsDataURL(fl);
}
// فرم و لیست مدیریت محصولات
function bindPr(){
  const f=$('#pf2');
  f.elements.c.oninput=()=>{pimg=''};
  $('#pcf').onchange=ev=>shrink(ev.target.files[0],400,400,u=>{pimg=u;f.elements.c.value='';$('#ppv').src=u;$('#ppv').hidden=false});
  f.onsubmit=ev=>{
    ev.preventDefault();const d=new FormData(f);
    const o={n:d.get('n').trim(),p:d.get('p'),k:d.get('k'),img:pimg&&pimg.startsWith('data:')?pimg:d.get('c').trim()};
    if(edp)Object.assign(edp,o);else prods.unshift({id:Math.max(0,...prods.map(i=>i.id))+1,x:'',...o});
    if(!save('gs_pr',prods)){$('#pmsg').textContent='حافظه مرورگر پر شد؛ عکس کوچک‌تری انتخاب کنید.';return}
    toast(edp?'✅ تغییرات محصول ذخیره شد':'✅ محصول اضافه شد');edp=null;drawAdmin();
  };
  if(edp)$('#pcn').onclick=()=>{edp=null;drawAdmin()};
  $('#ps').oninput=drawPl;drawPl();
}
function drawPl(){
  const s=$('#ps').value.trim().toLowerCase(),l=prods.filter(i=>!s||i.n.toLowerCase().includes(s));
  $('#pc').textContent=fa(l.length)+' محصول';
  $('#pl').innerHTML=l.map(i=>`<div class="row"><b>${esc(i.n)}</b><span><i class="p ${i.p}">${i.p.toUpperCase()}</i> ${i.k==='d'?'دستگاه':KN[i.k]}</span><button class="pe" data-id="${i.id}">ویرایش</button><button class="pd" data-id="${i.id}">حذف</button></div>`).join('')||'<div class="empty">محصولی پیدا نشد.</div>';
}

function drawSg(){ // لیست پیشنهادهای نظرسنجی با دکمه حذف
  const sg=load('gs_sg',[]);
  $('#sl').innerHTML=sg.map((s,i)=>`<div class="row"><b>${esc([].concat(s.n).join(' | '))}</b><span>${new Date(s.t).toLocaleDateString('fa')}</span><button class="sd" data-i="${i}">حذف</button></div>`).join('')||'<div class="empty">هنوز پیشنهادی ثبت نشده.</div>';
}
function drawList(){
  const s=$('#as').value.trim().toLowerCase(),l=games.filter(g=>!s||g.title.toLowerCase().includes(s));
  $('#ac').textContent=fa(l.length)+' بازی';
  $('#al').innerHTML=l.map(g=>`<div class="row"><b>${esc(g.title)}</b><span>${pills(g)}</span><button class="eb" data-id="${g.id}">ویرایش</button><button class="del" data-id="${g.id}">حذف</button></div>`).join('')||'<div class="empty">بازی‌ای پیدا نشد.</div>';
}

/* ================= مسیریابی ================= */
function route(){
  page=(location.hash||'#home').slice(1);
  if(!(page in CAT)&&!['devices','acc','timeline','admin'].includes(page))page='home';
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.hash==='#'+page));
  document.querySelectorAll('.dd').forEach(d=>{d.classList.remove('open');d.classList.toggle('on',!!d.querySelector('a.on'))});
  $('#adm').hidden=!ok();
  ({home:drawHome,admin:drawAdmin,devices:()=>drawShop(1),acc:()=>drawShop(0),timeline:drawTL}[page]||drawCatalog)();
  scrollTo(0,0);
}

/* ================= رویدادها ================= */
document.addEventListener('click',e=>{
  const t=e.target,f=t.closest('.fav'),d=t.closest('.del'),b=t.closest('.ddb'),eb=t.closest('.eb'),y=t.closest('.yr');
  document.querySelectorAll('.dd').forEach(x=>x.classList.toggle('open',!!b&&x===b.parentElement&&!x.classList.contains('open')));
  if(t.closest('#dc'))roll();
  const ar=t.closest('.ar'),sc=t.closest('[data-sp]'),sk2=t.closest('[data-sk]'),sd=t.closest('.sd');
  if(ar){const r=ar.closest('.rw').querySelector('.rs');r.scrollBy({left:+ar.dataset.d*r.clientWidth*.8,behavior:'smooth'})}
  if(sc){sp=sc.dataset.sp;drawShop(page==='devices')}
  if(sk2){sk=sk2.dataset.sk;drawShop(0)}
  if(sd&&confirm('این پیشنهاد حذف شود؟')){const sg=load('gs_sg',[]);sg.splice(+sd.dataset.i,1);save('gs_sg',sg);drawSg()}
  if(y){yr=+y.dataset.y;drawTL()}
  if(f){ // علاقه‌مندی
    const id=+f.dataset.id;
    if(favs.has(id))favs.delete(id);else{favs.add(id);st.f[id]=(st.f[id]||0)+1;save('gs_st',st);award('first');if(favs.size>=5)award('five')}
    save('gs_favs2',[...favs]);page==='favs'?drawCatalog():f.textContent=favs.has(id)?'❤️':'🤍';
  }
  const pe=t.closest('.pe'),pd=t.closest('.pd');
  if(pe){edp=prods.find(i=>i.id===+pe.dataset.id);drawAdmin();$('#pf2').scrollIntoView()}
  if(pd){const i=prods.find(x=>x.id===+pd.dataset.id);if(i&&confirm(`محصول «${i.n}» حذف شود؟`)){prods=prods.filter(x=>x!==i);save('gs_pr',prods);drawPl()}}
  if(eb){ed=games.find(g=>g.id===+eb.dataset.id);drawAdmin();scrollTo(0,0)}
  if(d){ // حذف بازی
    const id=+d.dataset.id,g=games.find(x=>x.id===id);
    if(!g||!confirm(`بازی «${g.title}» حذف شود؟`))return;
    games=games.filter(x=>x.id!==id);favs.delete(id);delete st.f[id];
    save('gs_g2',games);save('gs_favs2',[...favs]);save('gs_st',st);drawList();
  }
});
// نظرسنجی (یک پیشنهاد در هفته)
const wk=()=>{const d=new Date(),j=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-'+Math.floor(((d-j)/864e5+j.getDay())/7)};
document.addEventListener('submit',e=>{
  if(e.target.id!=='pf')return;e.preventDefault();
  const n=e.target.querySelector('input').value.trim(),m=$('#pm'),sg=load('gs_sg',[]);
  if(!n)return m.textContent='اول یه اسم بنویس بابا 😅';
  if(sg.some(s=>s.w===wk()))return m.textContent='این هفته سهمیه‌ات رو زدی، هفته بعد برگرد 😎';
  if(games.some(g=>g.title.toLowerCase()===n.toLowerCase()))return m.textContent=`«${n}» که همین الان داریم! یه چیز تازه‌تر بگو 😜`;
  sg.push({w:wk(),n,t:Date.now()});save('gs_sg',sg);award('sug');
  m.textContent=pick(['چشم خوشتیپ! 😎 ثبتش کردم','ناز نفست! 💜 می‌رسونمش','فرمانده، حله! 🫡','نمی‌صرفه... شوخی کردم 😄 ثبت شد!']);e.target.reset();
});
// اگر عکس باز نشد، کاور پیش‌فرض
main.addEventListener('error',e=>{const i=e.target;if(i.tagName!=='IMG')return;if(i.dataset.wk||!i.alt)i.hidden=true;else i.src=ph(i.alt)},true);
// کلیک روی لوگو: خانه ؛ ۵ بار پشت‌سرهم: ورود مدیر
let lc=0,lt;$('#logo').onclick=()=>{clearTimeout(lt);lt=setTimeout(()=>lc=0,2500);if(++lc>=5){lc=0;location.hash='#admin'}else location.hash='#home'};

/* ================= تم کنسولی ================= */
const TH=['dark','ps','xbox'],TN={dark:'🌙 Dark Mode',ps:'🎮 PS Mode',xbox:'🟩 Xbox Mode'};
let th=load('gs_th','dark');
function setTh(t){th=TH.includes(t)?t:'dark';document.body.dataset.t=th;$('#th').textContent=TN[th];save('gs_th',th);cols()}
$('#th').onclick=()=>setTh(TH[(TH.indexOf(th)+1)%3]);

/* ================= ذرات نئونی و نور موس ================= */
const cv=$('#fx'),cx=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,COL=['#a855f7','#3b82f6'],P=[],T=[];
function cols(){const s=getComputedStyle(document.body);COL=[s.getPropertyValue('--a1').trim(),s.getPropertyValue('--a2').trim()]}
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
rs();addEventListener('resize',rs);
for(let i=0;i<(innerWidth<700?25:50);i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.6,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,c:i%2});
if(!still)addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){T.push({x:e.clientX,y:e.clientY,l:1,c:T.length%2});if(T.length>28)T.shift()}});
function dot(x,y,r,a,c,b){cx.globalAlpha=a;cx.fillStyle=cx.shadowColor=COL[c];cx.shadowBlur=b;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
function fx(){
  cx.clearRect(0,0,W,H);
  for(const p of P){if(!still){p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H}dot(p.x,p.y,p.r,.55,p.c,6)}
  for(const t of T){t.l-=.03;dot(t.x,t.y,2.2*t.l+.6,t.l*.9,t.c,10)}
  T=T.filter(t=>t.l>0);requestAnimationFrame(fx);
}

/* ================= شروع ================= */
setTh(th);fx();
addEventListener('hashchange',route);
route();
</script>
</body>
</html>
